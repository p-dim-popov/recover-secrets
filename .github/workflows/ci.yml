name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  E2E_PUBLIC_KEY: "age1juvuevpt97w6vmr9ffzxltn0kttwqcdqn5ayz7j2z032r79d7cjqc5k4zy"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -x recover.sh decrypt.sh source/*.sh tests/*.sh
      - run: make check
      # Installer pinned to rhysd/actionlint main at 011a6d15 (resolved
      # 2026-09-25); the argument pins the actionlint release it downloads.
      - run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/011a6d15e749bb3f2d771eed9c7aa0e7e3e10ee7/scripts/download-actionlint.bash | bash -s -- 1.7.12
          ./actionlint -color

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y age
      - if: runner.os == 'macOS'
        run: brew install age
      - run: bash tests/run.sh

  # End to end the way a repository that blocks third-party actions runs it:
  # no `uses:` before the recover step, recover.sh fetched from this commit.
  e2e-bundle:
    runs-on: ubuntu-latest
    steps:
      - id: recover
        env:
          RS_SECRETS_JSON: ${{ toJSON(secrets) }}
          RS_PUBLIC_KEY: ${{ env.E2E_PUBLIC_KEY }}
          RS_INCLUDE: RS_TEST_SECRET
        shell: bash   # bash -eo pipefail: a failed download fails the step
        run: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/recover.sh | bash
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get install -y age
      - env:
          BLOB: ${{ steps.recover.outputs.blob }}
          KEY: ${{ secrets.RS_TEST_PRIVATE_KEY }}
        run: |
          value="$(./decrypt.sh --blob "$BLOB" --key <(printf '%s\n' "$KEY") | jq -r '.RS_TEST_SECRET')"
          test "$value" = "recover-secrets-e2e-ok"
          test "$(./decrypt.sh --blob "$BLOB" --key <(printf '%s\n' "$KEY") | jq 'length')" = 1

  # End to end through the action directly, with the artifact path.
  e2e-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: recover
        uses: ./
        with:
          secrets-json: ${{ toJSON(secrets) }}
          public-key: ${{ env.E2E_PUBLIC_KEY }}
          include: RS_TEST_SECRET
          artifact-name: e2e-blob
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-blob
          path: dl
      - run: sudo apt-get install -y age
      - env:
          BLOB: ${{ steps.recover.outputs.blob }}
          KEY: ${{ secrets.RS_TEST_PRIVATE_KEY }}
        run: |
          test "$(cat dl/blob.txt)" = "$BLOB"
          value="$(./decrypt.sh --file dl/blob.txt --key <(printf '%s\n' "$KEY") | jq -r '.RS_TEST_SECRET')"
          test "$value" = "recover-secrets-e2e-ok"

  # End to end through the action with public-key-url: the key is fetched from
  # this commit's copy of tests/fixtures/e2e-public-key.txt.
  e2e-action-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: recover
        uses: ./
        with:
          secrets-json: ${{ toJSON(secrets) }}
          public-key-url: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/tests/fixtures/e2e-public-key.txt
          include: RS_TEST_SECRET
      - run: sudo apt-get install -y age
      - env:
          BLOB: ${{ steps.recover.outputs.blob }}
          KEY: ${{ secrets.RS_TEST_PRIVATE_KEY }}
        run: |
          value="$(./decrypt.sh --blob "$BLOB" --key <(printf '%s\n' "$KEY") | jq -r '.RS_TEST_SECRET')"
          test "$value" = "recover-secrets-e2e-ok"
