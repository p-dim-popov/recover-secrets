<svg xmlns="http://www.w3.org/2000/svg" width="860" height="236" viewBox="0 0 860 236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <title>decrypt.sh turns the blob from the run summary into plaintext on your machine</title>
  <rect width="860" height="236" rx="8" fill="#0d1117"/>
  <rect width="860" height="32" rx="8" fill="#161b22"/>
  <rect y="24" width="860" height="8" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="6" fill="#27c93f"/>
  <text x="430" y="21" text-anchor="middle" fill="#8b949e" font-size="13">your machine</text>
  <g fill="#c9d1d9">
    <text x="20" y="62"><tspan fill="#7ee787">$</tspan><tspan x="37">bash decrypt.sh --blob </tspan><tspan fill="#a5d6ff">'rs1:age:YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IHNzaC1lZDI1NTE5IER…Zw=='</tspan><tspan> \</tspan></text>
    <text x="71" y="84">--key ~/.ssh/id_ed25519</text>
    <text x="20" y="116">{</text>
    <text x="37" y="138"><tspan fill="#79c0ff">"AWS_ACCESS_KEY_ID"</tspan><tspan>: </tspan><tspan fill="#a5d6ff">"AKIAIOSFODNN7EXAMPLE"</tspan><tspan>,</tspan></text>
    <text x="37" y="160"><tspan fill="#79c0ff">"AWS_SECRET_ACCESS_KEY"</tspan><tspan>: </tspan><tspan fill="#a5d6ff">"wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"</tspan><tspan>,</tspan></text>
    <text x="37" y="182"><tspan fill="#79c0ff">"DATABASE_URL"</tspan><tspan>: </tspan><tspan fill="#a5d6ff">"postgres://app:hunter2@db.internal:5432/prod"</tspan></text>
    <text x="20" y="204">}</text>
  </g>
</svg>
